<main class="page" *ngIf="viewModel$ | async as vm">
  <ng-container *ngIf="vm.status === 'success' && vm.olympic; else status">
    <app-header
      [title]="vm.olympic.country"
      [indicators]="vm.indicators"
    ></app-header>
    <app-medal-evolution-chart
      [participations]="vm.olympic.participations"
    ></app-medal-evolution-chart>
  </ng-container>

  <ng-template #status>
    <p *ngIf="vm.status === 'loading'" class="status" role="status">
      Loading country data…
    </p>
    <p *ngIf="vm.status === 'empty'" class="status" role="status">
      {{ vm.message }}
    </p>
    <p *ngIf="vm.status === 'error'" class="status error" role="alert">
      {{ vm.message }}
    </p>
  </ng-template>

  <a class="back-link" routerLink="/" aria-label="Go back to the dashboard">
    Go back
  </a>
</main>
