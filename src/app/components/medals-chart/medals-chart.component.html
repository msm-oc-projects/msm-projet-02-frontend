<p id="chart-instructions" class="instructions">
  Click a chart segment or choose a country below to open its details.
</p>

<div class="chart-wrapper">
  <canvas
    #chartCanvas
    aria-label="Pie chart showing the total number of Olympic medals for each country"
    aria-describedby="chart-instructions"
    role="img"
  ></canvas>
</div>

<nav class="country-links" aria-label="Country details">
  <button
    type="button"
    *ngFor="let olympic of olympics"
    (click)="selectCountry(olympic.id)"
  >
    {{ olympic.country }}
  </button>
</nav>
